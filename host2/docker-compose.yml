version: '3.8'

networks:
  zabbix-net:
    driver: bridge

volumes:
  vault2-data:
  vault-secrets:
  zabbix-proxy-data:
  postgres-standby-data:
  
services:

  vault-2:
    image: hashicorp/vault:1.17
    container_name: vault-2
    restart: unless-stopped
    ports:
      - "8200:8200"
      - "8201:8201"
    cap_add:
      - IPC_LOCK
    extra_hosts:
      - "vault-1:192.168.200.170"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_CLUSTER_ADDR: "http://192.168.200.171:8201"
      VAULT_API_ADDR: "http://192.168.200.171:8200"
    volumes:
      - /home/fmassol/host2/vault-2.hcl:/tmp/vault.hcl:ro
      - vault2-data:/vault/data
    command: server -config=/tmp/vault.hcl
    networks:
      - zabbix-net

  vault-agent-2:
    image: hashicorp/vault:1.17
    container_name: vault-agent-2
    restart: unless-stopped
    depends_on:
      - vault-2
    environment:
      VAULT_ADDR: "http://vault-2:8200"
    volumes:
      - /home/fmassol/host2/vault-agent/agent.hcl:/tmp/agent.hcl:ro
      - /home/fmassol/host2/vault-agent/role_id:/vault/approle/role_id:ro
      - /home/fmassol/host2/vault-agent/secret_id:/vault/approle/secret_id:ro
      - /home/fmassol/host2/vault-agent/db.tmpl:/tmp/db.tmpl:ro
      - /home/fmassol/host2/vault-agent/monitoring.tmpl:/tmp/monitoring.tmpl:ro
      - vault-secrets:/vault/secrets
    command: agent -config=/tmp/agent.hcl
    networks:
      - zabbix-net

  zabbix-db-standby:
    build:
      context: ./repmgr
    container_name: zabbix-db-standby
    restart: unless-stopped
    ports:
      - "192.168.200.171:5432:5432"
    extra_hosts:
      - "zabbix-db:192.168.200.170"
    entrypoint: ["/usr/local/bin/entrypoint-standby.sh"]
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRIMARY_HOST: "192.168.200.170"
      REPMGR_PASSWORD: ${REPMGR_PASSWORD}
    volumes:
      - postgres-standby-data:/var/lib/postgresql/data
      - ./repmgr/repmgr.conf:/etc/repmgr.conf:ro
    networks:
      - zabbix-net

  pg-check:
    build:
      context: ./pg-check
    container_name: pg-check
    restart: unless-stopped
    network_mode: "service:zabbix-db-standby"
    environment:
      POSTGRES_USER: zabbix
    depends_on:
      - zabbix-db-standby

  zabbix-server-2:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server-2
    restart: unless-stopped
    depends_on:
      - vault-agent-2
    ports:
      - "10051:10051"
    extra_hosts:
      - "zabbix-db:192.168.200.170"
      - "zabbix-server:192.168.200.170"
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
      ZBX_HANODENAME: "zabbix-node-2"
      ZBX_HAMODE: "active"
    volumes:
      - vault-secrets:/vault/secrets:ro
    networks:
      - zabbix-net

  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:alpine-7.0-latest
    container_name: zabbix-proxy
    restart: unless-stopped
    ports:
      - "10053:10051"
    extra_hosts:
      - "zabbix-server:192.168.200.170"
    environment:
      ZBX_SERVER_HOST: "192.168.200.170"
      ZBX_SERVER_PORT: "10051"
      ZBX_HOSTNAME: "Poller-Distant-01"
      ZBX_PROXYMODE: "0"
      ZBX_CONFIGFREQUENCY: "60"
      ZBX_DATASENDERFREQUENCY: "5"
      ZBX_PROXYOFFLINEBUFFER: "1"
    volumes:
      - zabbix-proxy-data:/var/lib/zabbix
    networks:
      - zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent-host2
    hostname: host2-docker
    restart: unless-stopped
    ports:
      - "10050:10050"
    extra_hosts:
      - "zabbix-server:192.168.200.170"
    environment:
      ZBX_HOSTNAME: "host2-docker"
      ZBX_SERVER_HOST: "zabbix-server,zabbix-server-2"
      ZBX_SERVER_PORT: "10051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: root
    networks:
      - zabbix-net
