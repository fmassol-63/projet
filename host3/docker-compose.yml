version: '3.8'

networks:
  zabbix-net:
    driver: bridge

volumes:
  vault3-data:
  repmgr-witness-data:

services:
  vault-3:
    image: hashicorp/vault:1.17
    container_name: vault-3
    restart: unless-stopped
    ports:
      - "8200:8200"
      - "8201:8201"
    cap_add:
      - IPC_LOCK
    extra_hosts:
      - "vault-1:192.168.200.170"
      - "vault-2:192.168.200.171"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_CLUSTER_ADDR: "http://192.168.200.172:8201"
      VAULT_API_ADDR: "http://192.168.200.172:8200"
    volumes:
      - ./vault-3.hcl:/tmp/vault.hcl:ro
      - vault3-data:/vault/data
    command: server -config=/tmp/vault.hcl
    networks:
      - zabbix-net

  repmgr-witness:
    build:
      context: ./repmgr
    container_name: repmgr-witness
    restart: unless-stopped
    ports:
      - "192.168.200.172:5432:5432"
    extra_hosts:
      - "zabbix-db:192.168.200.170"
    entrypoint: ["/usr/local/bin/entrypoint-witness.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRIMARY_HOST: "192.168.200.170"
      REPMGR_PASSWORD: ${REPMGR_PASSWORD}
    volumes:
      - repmgr-witness-data:/var/lib/postgresql/data
      - ./repmgr/repmgr.conf:/etc/repmgr.conf:ro
    networks:
      - zabbix-net
